<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root{
  --c1:#011f4b;
  --c2:#03396c;
  --c3:#005b96;
  --c4:#6497b1;
  --c5:#b3cde0;
}

*{ box-sizing:border-box; }

html, body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:transparent;
  overflow:hidden;
  font-family:system-ui,-apple-system,sans-serif;
}

/* center widget inside iframe */
body{
  display:grid;
  place-items:center;
}

.calc{
  width:280px;
  background:var(--c2);
  padding:16px;
  border-radius:28px;
  transform-origin:center;
}

/* display */
.display{
  background:var(--c5);
  border-radius:20px;
  padding:10px 14px;
  margin-bottom:14px;
  color:var(--c1);
}

.small{
  font-size:14px;
  text-align:right;
  min-height:18px;
  opacity:.7;
}

.big{
  font-size:40px;
  text-align:right;
  line-height:1.1;
  min-height:44px;
}

/* buttons */
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

button{
  height:58px;
  border:none;
  border-radius:50%;
  font-size:20px;
  cursor:pointer;
}

.num{ background:var(--c4); color:var(--c1); }
.op{ background:var(--c3); color:white; }
.top{ background:var(--c5); color:var(--c1); }

.zero{
  grid-column:span 2;
  border-radius:30px;
}
</style>
</head>

<body>
<div class="calc">

  <div class="display">
    <div id="small" class="small"></div>
    <div id="big" class="big">0</div>
  </div>

  <div class="grid">
    <button class="top" onclick="ac()">AC</button>
    <button class="top" onclick="backspace()">⌫</button>
    <button class="op" onclick="percent()">%</button>
    <button class="op" onclick="setOp('/')">÷</button>

    <button class="num" onclick="tapNum('7')">7</button>
    <button class="num" onclick="tapNum('8')">8</button>
    <button class="num" onclick="tapNum('9')">9</button>
    <button class="op" onclick="setOp('*')">×</button>

    <button class="num" onclick="tapNum('4')">4</button>
    <button class="num" onclick="tapNum('5')">5</button>
    <button class="num" onclick="tapNum('6')">6</button>
    <button class="op" onclick="setOp('-')">−</button>

    <button class="num" onclick="tapNum('1')">1</button>
    <button class="num" onclick="tapNum('2')">2</button>
    <button class="num" onclick="tapNum('3')">3</button>
    <button class="op" onclick="setOp('+')">+</button>

    <button class="num zero" onclick="tapNum('0')">0</button>
    <button class="num" onclick="tapDot()">.</button>
    <button class="op" onclick="equals()">=</button>
  </div>
</div>

<script>
/* 🔥 AUTO SCALE FOR NOTION FULLSCREEN */
function setScale(){
  const calc = document.querySelector(".calc");

  const baseW = 280;
  const baseH = 520;

  const w = window.innerWidth;
  const h = window.innerHeight;

  const scale = Math.min(
    w/(baseW+40),
    h/(baseH+40),
    1.6
  );

  calc.style.transform = `scale(${scale})`;
}

window.addEventListener("resize", setScale);
window.addEventListener("load", setScale);


/* ===== Calculator Logic ===== */

const smallEl = document.getElementById("small");
const bigEl   = document.getElementById("big");

let ans = 0;
let left = null;
let op = null;
let input = "0";
let justEvaluated = false;

function opSymbol(o){
  return o==="*"?"×":o==="/"?"÷":o;
}

function stripFloat(n){
  if(Number.isInteger(n)) return String(n);
  return String(parseFloat(n.toFixed(10)));
}

function formatAnsLine(){
  return `Ans = ${stripFloat(ans)}`;
}

function hasTypedSomething(){
  return input!=="0"||input.includes(".");
}

function render(){
  if(justEvaluated&&left!==null&&op!==null){
    smallEl.textContent=`${stripFloat(left)} ${opSymbol(op)} ${input} =`;
  }else if(op!==null||left!==null||input!=="0"){
    smallEl.textContent=formatAnsLine();
  }else{
    smallEl.textContent="";
  }

  if(!justEvaluated&&op!==null&&left!==null){
    const rightPart=(input==="0"&&!hasTypedSomething())?"":` ${input}`;
    bigEl.textContent=`${stripFloat(left)} ${opSymbol(op)}${rightPart}`;
  }else{
    bigEl.textContent=input;
  }
}

function ac(){
  ans=0;
  left=null;
  op=null;
  input="0";
  justEvaluated=false;
  render();
}

function tapNum(d){
  if(justEvaluated&&op===null){
    input="0";
    justEvaluated=false;
  }

  input=input==="0"?d:input+d;
  render();
}

function tapDot(){
  if(justEvaluated&&op===null){
    input="0";
    justEvaluated=false;
  }
  if(!input.includes(".")) input+=".";
  render();
}

function backspace(){
  if(justEvaluated) justEvaluated=false;
  input=input.length>1?input.slice(0,-1):"0";
  render();
}

function setOp(newOp){
  if(justEvaluated){
    left=Number(input);
    op=newOp;
    input="0";
    justEvaluated=false;
    render();
    return;
  }

  if(left===null){
    left=Number(input);
    op=newOp;
    input="0";
    render();
    return;
  }

  if(op!==null&&hasTypedSomething()){
    const right=Number(input);
    const result=compute(left,op,right);
    left=result;
    ans=result;
    input="0";
  }
  op=newOp;
  render();
}

function percent(){
  input=stripFloat(Number(input)/100);
  render();
}

function equals(){
  if(left===null||op===null) return;

  const right=Number(input);
  const result=compute(left,op,right);

  ans=result;
  input=stripFloat(result);
  justEvaluated=true;

  render();

  left=null;
  op=null;
}

function compute(a,o,b){
  switch(o){
    case"+":return a+b;
    case"-":return a-b;
    case"*":return a*b;
    case"/":return b===0?NaN:a/b;
  }
}

render();
</script>
</body>
</html>
