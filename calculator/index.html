<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
:root{
  --c1:#011f4b;
  --c2:#03396c;
  --c3:#005b96;
  --c4:#6497b1;
  --c5:#b3cde0;
}

*{ box-sizing:border-box; }

html, body{
  margin:0;
  padding:0;
  background:transparent;
  overflow-x:hidden;
  font-family:system-ui, -apple-system, sans-serif;
}

/* center inside the Notion iframe */
body{
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

/* RESPONSIVE: never exceed iframe width */
.calc{
  background:var(--c2);
  padding:clamp(12px, 3vw, 16px);
  border-radius:28px;
  width:min(280px, 100%);
}

/* DISPLAY */
.display{
  background:var(--c5);
  border-radius:20px;
  padding:clamp(8px, 2.5vw, 10px) clamp(10px, 3vw, 14px);
  margin-bottom:clamp(10px, 3vw, 14px);
  color:var(--c1);
}

.small{
  font-size:clamp(12px, 3.2vw, 14px);
  text-align:right;
  min-height:18px;
  opacity:.7;
}

.big{
  font-size:clamp(30px, 8.5vw, 40px);
  text-align:right;
  line-height:1.1;
  min-height:44px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:clamp(8px, 2.8vw, 12px);
}

button{
  width:100%;
  aspect-ratio:1 / 1;
  border:none;
  border-radius:50%;
  font-size:clamp(16px, 4.8vw, 20px);
  cursor:pointer;
}

/* styles */
.num{ background:var(--c4); color:var(--c1); }
.op{ background:var(--c3); color:white; }
.top{ background:var(--c5); color:var(--c1); }

/* 0 button */
.zero{
  grid-column:span 2;
  aspect-ratio:auto;
  border-radius:30px;
  height:auto;
}
</style>
</head>

<body>
  <div class="calc">
    <div class="display">
      <div id="small" class="small"></div>
      <div id="big" class="big">0</div>
    </div>

    <!-- NO inline onclick. We use data-* and JS listeners. -->
    <div class="grid" id="grid">
      <button class="top" data-action="ac">AC</button>
      <button class="top" data-action="back">⌫</button>
      <button class="op"  data-action="percent">%</button>
      <button class="op"  data-op="/">÷</button>

      <button class="num" data-num="7">7</button>
      <button class="num" data-num="8">8</button>
      <button class="num" data-num="9">9</button>
      <button class="op"  data-op="*">×</button>

      <button class="num" data-num="4">4</button>
      <button class="num" data-num="5">5</button>
      <button class="num" data-num="6">6</button>
      <button class="op"  data-op="-">−</button>

      <button class="num" data-num="1">1</button>
      <button class="num" data-num="2">2</button>
      <button class="num" data-num="3">3</button>
      <button class="op"  data-op="+">+</button>

      <button class="num zero" data-num="0">0</button>
      <button class="num" data-num=".">.</button>
      <button class="op"  data-action="eq">=</button>
    </div>
  </div>

<script>
const smallEl = document.getElementById("small");
const bigEl   = document.getElementById("big");
const gridEl  = document.getElementById("grid");

let ans = 0;
let left = null;
let op = null;

// input always stores the number you're typing (left side before op, right side after op)
let input = "0";

// after pressing "=" we show result; typing a number starts fresh
let justEvaluated = false;

// IMPORTANT: rightStarted means "user has begun typing right operand"
let rightStarted = false;

function opSymbol(o){ return o === '*' ? '×' : (o === '/' ? '÷' : o); }
function stripFloat(n){
  if (!Number.isFinite(n)) return "NaN";
  return Number.isInteger(n) ? String(n) : String(parseFloat(n.toFixed(10)));
}
function formatAnsLine(){ return `Ans = ${stripFloat(ans)}`; }

function render(){
  // small line
  if (op !== null || left !== null || input !== "0"){
    smallEl.textContent = formatAnsLine();
  } else {
    smallEl.textContent = "";
  }

  // big line
  if (!justEvaluated && op !== null && left !== null){
    // show `left op` and ONLY show right operand if rightStarted
    const rightPart = rightStarted ? ` ${input}` : "";
    bigEl.textContent = `${stripFloat(left)} ${opSymbol(op)}${rightPart}`;
  } else {
    bigEl.textContent = input;
  }
}

function ac(){
  ans = 0;
  left = null;
  op = null;
  input = "0";
  justEvaluated = false;
  rightStarted = false;
  render();
}

function tapNum(d){
  // if result is showing and there's no pending operation, start fresh
  if (justEvaluated && op === null){
    input = "0";
    justEvaluated = false;
  }

  // if operator chosen, we're typing right operand
  if (op !== null && left !== null) rightStarted = true;

  if (d === "."){
    if (!input.includes(".")) input += ".";
  } else {
    input = (input === "0") ? d : (input + d);
  }

  render();
}

function setOp(newOp){
  // if we just evaluated, chain from the current result
  if (justEvaluated){
    left = Number(input);
    op = newOp;
    input = "0";
    justEvaluated = false;
    rightStarted = false;
    render();
    return;
  }

  // first operator
  if (left === null){
    left = Number(input);
    op = newOp;
    input = "0";
    rightStarted = false;
    render();
    return;
  }

  // if we already had an op and user typed right operand, compute chaining
  if (op !== null && rightStarted){
    const right = Number(input);
    const result = compute(left, op, right);
    ans = result;
    left = result;
    input = "0";
    rightStarted = false;
  }

  op = newOp;
  rightStarted = false;
  render();
}

function percent(){
  const n = Number(input);
  input = stripFloat(n / 100);
  if (op !== null && left !== null) rightStarted = true;
  render();
}

function equals(){
  if (left === null || op === null) return;
  if (!rightStarted) return; // can't equals if user never typed right operand

  const right = Number(input);
  const result = compute(left, op, right);

  ans = result;
  input = stripFloat(result);
  justEvaluated = true;

  left = null;
  op = null;
  rightStarted = false;

  render();
}

function compute(a,o,b){
  switch(o){
    case '+': return a + b;
    case '-': return a - b;
    case '*': return a * b;
    case '/': return b === 0 ? NaN : a / b;
  }
  return NaN;
}

/*
Backspace behavior you asked for:
- If you're at `9 × 8` -> back -> `9 ×` (rightStarted becomes false)
- If you're at `9 ×` -> back -> `9` (operator removed)
- If you're at `9` -> back -> `0`
*/
function backspace(){
  // ✅ If a result is currently showing (after equals), backspace should CLEAR to 0
  if (justEvaluated && left === null && op === null){
    input = "0";
    ans = 0;              // optional: keeps your "Ans = 0" consistent
    justEvaluated = false;
    rightStarted = false;
    render();
    return;
  }

  // If we have `left op` and right side hasn't started, delete operator
  if (op !== null && left !== null && !rightStarted){
    input = stripFloat(left);
    left = null;
    op = null;
    rightStarted = false;
    render();
    return;
  }

  // If right operand started, delete one char; if last char -> go back to `left op`
  if (op !== null && left !== null && rightStarted){
    if (input.length > 1){
      input = input.slice(0, -1);
      if (input === "-" || input === "") input = "0";
    } else {
      input = "0";
      rightStarted = false;  // goes back to showing `left op`
    }
    render();
    return;
  }

  // Normal deletion on a single number
  if (input.length > 1){
    input = input.slice(0, -1);
  } else {
    input = "0";
  }
  if (input === "-" || input === "") input = "0";

  render();
}


// event delegation (works in embeds that block inline onclick)
gridEl.addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;

  const num = btn.dataset.num;
  const oper = btn.dataset.op;
  const action = btn.dataset.action;

  if (num !== undefined){
    tapNum(num);
    return;
  }
  if (oper !== undefined){
    setOp(oper);
    return;
  }
  if (action === "ac") return ac();
  if (action === "back") return backspace();
  if (action === "percent") return percent();
  if (action === "eq") return equals();
});

render();
</script>
</body>
</html>
