<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
:root{
  --c1:#011f4b;
  --c2:#03396c;
  --c3:#005b96;
  --c4:#6497b1;
  --c5:#b3cde0;
}

body{
  margin:0;
  background:transparent; /* embed-safe */
  font-family:system-ui, -apple-system, sans-serif;
}

.calc{
  background:var(--c2);
  padding:16px;
  border-radius:28px;
  width:280px;
}

.display{
  background:var(--c5);
  border-radius:20px;
  padding:10px 14px;
  margin-bottom:14px;
  color:var(--c1);
}

.small{
  font-size:14px;
  text-align:right;
  min-height:18px;
  opacity:.7;
}

.big{
  font-size:40px;
  text-align:right;
  line-height:1.1;
  min-height:44px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

button{
  height:58px;
  border:none;
  border-radius:50%;
  font-size:20px;
  cursor:pointer;
}

.num{ background:var(--c4); color:var(--c1); }
.op{ background:var(--c3); color:white; }
.top{ background:var(--c5); color:var(--c1); }

.zero{
  grid-column:span 2;
  border-radius:30px;
}
</style>
</head>

<body>
  <div class="calc">
    <div class="display">
      <div id="small" class="small"></div>
      <div id="big" class="big">0</div>
    </div>

    <div class="grid">
      <button class="top" onclick="ac()">AC</button>
      <button class="top" onclick="backspace()">⌫</button>
      <button class="op" onclick="percent()">%</button>
      <button class="op" onclick="setOp('/')">÷</button>

      <button class="num" onclick="tapNum('7')">7</button>
      <button class="num" onclick="tapNum('8')">8</button>
      <button class="num" onclick="tapNum('9')">9</button>
      <button class="op" onclick="setOp('*')">×</button>

      <button class="num" onclick="tapNum('4')">4</button>
      <button class="num" onclick="tapNum('5')">5</button>
      <button class="num" onclick="tapNum('6')">6</button>
      <button class="op" onclick="setOp('-')">−</button>

      <button class="num" onclick="tapNum('1')">1</button>
      <button class="num" onclick="tapNum('2')">2</button>
      <button class="num" onclick="tapNum('3')">3</button>
      <button class="op" onclick="setOp('+')">+</button>

      <button class="num zero" onclick="tapNum('0')">0</button>
      <button class="num" onclick="tapDot()">.</button>
      <button class="op" onclick="equals()">=</button>
    </div>
  </div>

<script>
const smallEl = document.getElementById("small");
const bigEl   = document.getElementById("big");

let ans = 0;             // last answer (shows as "Ans = ...")
let left = null;         // left operand (number)
let op = null;           // '+', '-', '*', '/'
let input = "0";         // current typed number string
let justEvaluated = false;

function opSymbol(o){
  return o === '*' ? '×' : (o === '/' ? '÷' : o);
}

function formatAnsLine(){
  // matches your screenshots: show "Ans = X" during entry/building
  return `Ans = ${stripFloat(ans)}`;
}

function stripFloat(n){
  // avoid "18.000000" vibes
  if (Number.isInteger(n)) return String(n);
  return String(parseFloat(n.toFixed(10)));
}

function render(){
  // SMALL LINE
  if (justEvaluated && left !== null && op !== null){
    // after equals: show "6 × 3 ="
    smallEl.textContent = `${stripFloat(left)} ${opSymbol(op)} ${input} =`;
  } else if (op !== null || left !== null || input !== "0"){
    // during entry/building: show "Ans = ..."
    smallEl.textContent = formatAnsLine();
  } else {
    // fresh AC state: blank (matches your first screenshot vibe)
    smallEl.textContent = "";
  }

  // BIG LINE
  if (!justEvaluated && op !== null && left !== null){
    // building expression: show "6 ×" or "6 × 3"
    const rightPart = (input === "0" && !hasTypedSomething()) ? "" : ` ${input}`;
    bigEl.textContent = `${stripFloat(left)} ${opSymbol(op)}${rightPart}`;
  } else {
    // normal number / result
    bigEl.textContent = input;
  }
}

function hasTypedSomething(){
  // true if user has typed a digit after choosing operator
  return input !== "0" || input.includes(".");
}

function ac(){
  ans = 0;
  left = null;
  op = null;
  input = "0";
  justEvaluated = false;
  render();
}

function tapNum(d){
  if (justEvaluated && op === null){
    // starting a new entry after result (but keep ans)
    input = "0";
    justEvaluated = false;
  }

  if (input === "0") input = d;
  else input += d;

  render();
}

function tapDot(){
  if (justEvaluated && op === null){
    input = "0";
    justEvaluated = false;
  }
  if (!input.includes(".")) input += ".";
  render();
}

function backspace(){
  if (justEvaluated){
    // allow editing the result like iOS-ish
    justEvaluated = false;
  }
  input = input.length > 1 ? input.slice(0, -1) : "0";
  render();
}

function setOp(newOp){
  // if we just evaluated, we want to continue from the answer
  if (justEvaluated){
    left = Number(input);
    op = newOp;
    input = "0";
    justEvaluated = false;
    render();
    return;
  }

  // if no left yet, set it from current input
  if (left === null){
    left = Number(input);
    op = newOp;
    input = "0";
    render();
    return;
  }

  // if left + op already exists and user presses another op:
  // if they typed a right number, compute intermediate; else just swap op
  if (op !== null && hasTypedSomething()){
    const right = Number(input);
    const result = compute(left, op, right);
    left = result;
    ans = result;
    input = "0";
  }
  op = newOp;
  render();
}

function percent(){
  // simple percent: current input becomes input/100
  const n = Number(input);
  input = stripFloat(n / 100);
  render();
}

function equals(){
  if (left === null || op === null) return;

  const right = Number(input);
  const result = compute(left, op, right);

  // After equals: small shows "left op right =" and big shows result
  ans = result;
  input = stripFloat(result);
  justEvaluated = true;

  // keep left/op so small line can show the expression once
  // then if user starts new op, it will chain from input anyway
  render();

  // clear operation after showing expression once if they start typing next
  // (we’ll clear when they type a number with op === null in tapNum)
  left = null;
  op = null;
}

function compute(a, o, b){
  switch(o){
    case '+': return a + b;
    case '-': return a - b;
    case '*': return a * b;
    case '/': return b === 0 ? NaN : a / b;
  }
  return NaN;
}

// init
render();
</script>
</body>
</html>
