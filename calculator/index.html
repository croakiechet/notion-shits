<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
:root{
  --c1:#011f4b;
  --c2:#03396c;
  --c3:#005b96;
  --c4:#6497b1;
  --c5:#b3cde0;

  /* design size (do not change aesthetic) */
  --baseW: 260;
  --baseH: 520; /* approx height of calculator */
  --scale: 1;
}

/* embed-safe: prevent Notion scrollbars */
html, body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
  font-family:system-ui,-apple-system,sans-serif;
}

/* Stage is the available iframe space */
.stage{
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:0;
  box-sizing:border-box;
}

/* This wrapper scales the whole calculator evenly */
.scaleWrap{
  width: calc(var(--baseW) * 1px);
  transform: scale(var(--scale));
  transform-origin: top center;
  /* keep it crisp */
  will-change: transform;
}

/* --- your calculator styles (unchanged aesthetic) --- */
.calc{
  background:var(--c2);
  padding:14px;
  border-radius:28px;
  width:260px;
  box-sizing:border-box;
}

.display{
  background:var(--c5);
  border-radius:20px;
  padding:10px 14px;
  margin-bottom:14px;
  color:var(--c1);
}

.small{
  font-size:14px;
  text-align:right;
  min-height:18px;
  opacity:.7;
}

.big{
  font-size:36px;
  text-align:right;
  line-height:1.1;
  min-height:40px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

button{
  height:54px;
  border:none;
  border-radius:50%;
  font-size:18px;
  cursor:pointer;
}

.num{ background:var(--c4); color:var(--c1); }
.op{ background:var(--c3); color:white; }
.top{ background:var(--c5); color:var(--c1); }

.zero{
  grid-column:span 2;
  border-radius:30px;
}
</style>
</head>

<body>
  <div class="stage">
    <div class="scaleWrap">
      <div class="calc">
        <div class="display">
          <div id="small" class="small"></div>
          <div id="big" class="big">0</div>
        </div>

        <div class="grid">
          <button class="top" onclick="ac()">AC</button>
          <button class="top" onclick="backspace()">⌫</button>
          <button class="op" onclick="percent()">%</button>
          <button class="op" onclick="setOp('/')">÷</button>

          <button class="num" onclick="tapNum('7')">7</button>
          <button class="num" onclick="tapNum('8')">8</button>
          <button class="num" onclick="tapNum('9')">9</button>
          <button class="op" onclick="setOp('*')">×</button>

          <button class="num" onclick="tapNum('4')">4</button>
          <button class="num" onclick="tapNum('5')">5</button>
          <button class="num" onclick="tapNum('6')">6</button>
          <button class="op" onclick="setOp('-')">−</button>

          <button class="num" onclick="tapNum('1')">1</button>
          <button class="num" onclick="tapNum('2')">2</button>
          <button class="num" onclick="tapNum('3')">3</button>
          <button class="op" onclick="setOp('+')">+</button>

          <button class="num zero" onclick="tapNum('0')">0</button>
          <button class="num" onclick="tapDot()">.</button>
          <button class="op" onclick="equals()">=</button>
        </div>
      </div>
    </div>
  </div>

<script>
/* ------------------- scaling (fixes Notion cropping) ------------------- */
function fitScale(){
  const root = document.documentElement;
  const baseW = parseFloat(getComputedStyle(root).getPropertyValue('--baseW')) || 260;
  const baseH = parseFloat(getComputedStyle(root).getPropertyValue('--baseH')) || 520;

  // available space inside the iframe
  const vw = window.innerWidth;
  const vh = window.innerHeight;

  // scale down to fit, but never scale up (keeps it crisp)
  const s = Math.min(vw / baseW, vh / baseH, 1);

  root.style.setProperty('--scale', String(s));
}

window.addEventListener('resize', fitScale);
fitScale();

/* ------------------- calculator logic ------------------- */
const smallEl = document.getElementById("small");
const bigEl   = document.getElementById("big");

let left = null;
let op = null;
// "" means “right side not started yet”
let input = "0";

function opSymbol(o){
  return o === '*' ? '×' : (o === '/' ? '÷' : o);
}

function stripFloat(n){
  return Number.isInteger(n) ? String(n) : String(parseFloat(n.toFixed(10)));
}

function inputAsNumber(){
  return Number(input === "" ? "0" : input);
}

function render(){
  // keep small line unused (blank) to avoid extra logic
  smallEl.textContent = "";

  if (op !== null && left !== null){
    bigEl.textContent = (input === "")
      ? `${stripFloat(left)} ${opSymbol(op)}`
      : `${stripFloat(left)} ${opSymbol(op)} ${input}`;
    return;
  }

  bigEl.textContent = (input === "" ? "0" : input);
}

function ac(){
  left = null;
  op = null;
  input = "0";
  render();
}

function tapNum(d){
  if (input === "") input = d;
  else input = (input === "0") ? d : input + d;
  render();
}

function tapDot(){
  if (input === "") input = "0";
  if (!input.includes(".")) input += ".";
  render();
}

function backspace(){
  // If display is "8 ×" (right side empty), remove operator
  if (op !== null && left !== null && input === ""){
    op = null;
    input = stripFloat(left);
    left = null;
    render();
    return;
  }

  if (input.length > 1){
    input = input.slice(0, -1);
  } else {
    // if we were typing the right side, go back to empty (so it shows "8 ×")
    if (op !== null && left !== null) input = "";
    else input = "0";
  }
  render();
}

function setOp(newOp){
  // If user taps another operator while at "8 ×", just swap it
  if (left !== null && op !== null && input === ""){
    op = newOp;
    render();
    return;
  }

  if (left === null){
    left = inputAsNumber();
  } else if (op !== null && input !== ""){
    // chain if right side exists
    left = compute(left, op, inputAsNumber());
  }

  op = newOp;
  input = ""; // right side starts empty (so display shows "8 ×" not "8 × 0")
  render();
}

function percent(){
  input = stripFloat(inputAsNumber() / 100);
  render();
}

function equals(){
  if (left === null || op === null) return;

  const result = compute(left, op, inputAsNumber());
  input = stripFloat(result);

  left = null;
  op = null;
  render();
}

function compute(a,o,b){
  switch(o){
    case '+': return a+b;
    case '-': return a-b;
    case '*': return a*b;
    case '/': return b===0 ? NaN : a/b;
  }
}

render();
</script>
</body>
</html>
