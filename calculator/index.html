<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
:root{
  --c1:#011f4b;
  --c2:#03396c;
  --c3:#005b96;
  --c4:#6497b1;
  --c5:#b3cde0;
}

/* ⭐ THIS fixes Notion scrolling */
html, body{
  margin:0;
  padding:0;
  height:100%;
  overflow:hidden;
  background:transparent;
  font-family:system-ui,-apple-system,sans-serif;
}

/* center calculator safely */
body{
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

.calc{
  background:var(--c2);
  padding:14px; /* slightly reduced for embed */
  border-radius:28px;
  width:260px; /* embed-safe width */
  box-sizing:border-box;
}

.display{
  background:var(--c5);
  border-radius:20px;
  padding:10px 14px;
  margin-bottom:14px;
  color:var(--c1);
}

.small{
  font-size:14px;
  text-align:right;
  min-height:18px;
  opacity:.7;
}

.big{
  font-size:36px;
  text-align:right;
  line-height:1.1;
  min-height:40px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

button{
  height:54px;
  border:none;
  border-radius:50%;
  font-size:18px;
  cursor:pointer;
}

.num{ background:var(--c4); color:var(--c1); }
.op{ background:var(--c3); color:white; }
.top{ background:var(--c5); color:var(--c1); }

.zero{
  grid-column:span 2;
  border-radius:30px;
}
</style>
</head>

<body>
<div class="calc">
  <div class="display">
    <div id="small" class="small"></div>
    <div id="big" class="big">0</div>
  </div>

  <div class="grid">
    <button class="top" onclick="ac()">AC</button>
    <button class="top" onclick="backspace()">⌫</button>
    <button class="op" onclick="percent()">%</button>
    <button class="op" onclick="setOp('/')">÷</button>

    <button class="num" onclick="tapNum('7')">7</button>
    <button class="num" onclick="tapNum('8')">8</button>
    <button class="num" onclick="tapNum('9')">9</button>
    <button class="op" onclick="setOp('*')">×</button>

    <button class="num" onclick="tapNum('4')">4</button>
    <button class="num" onclick="tapNum('5')">5</button>
    <button class="num" onclick="tapNum('6')">6</button>
    <button class="op" onclick="setOp('-')">−</button>

    <button class="num" onclick="tapNum('1')">1</button>
    <button class="num" onclick="tapNum('2')">2</button>
    <button class="num" onclick="tapNum('3')">3</button>
    <button class="op" onclick="setOp('+')">+</button>

    <button class="num zero" onclick="tapNum('0')">0</button>
    <button class="num" onclick="tapDot()">.</button>
    <button class="op" onclick="equals()">=</button>
  </div>
</div>

<script>
const smallEl = document.getElementById("small");
const bigEl   = document.getElementById("big");

let ans = 0;
let left = null;
let op = null;

/*
  ✅ IMPORTANT: input can be "" (empty) when you're in "right side not started yet"
  This is what makes backspace able to delete the operator.
*/
let input = "0";
let justEvaluated = false;

function opSymbol(o){
  return o === '*' ? '×' : (o === '/' ? '÷' : o);
}

function formatAnsLine(){
  return `Ans = ${stripFloat(ans)}`;
}

function stripFloat(n){
  if (Number.isInteger(n)) return String(n);
  return String(parseFloat(n.toFixed(10)));
}

function displayInput(){
  // show 0 if empty, so UI stays neat
  return input === "" ? "0" : input;
}

function render(){
  if (justEvaluated && left !== null && op !== null){
    smallEl.textContent = `${stripFloat(left)} ${opSymbol(op)} ${displayInput()} =`;
  } else if (op !== null || left !== null || input !== "0"){
    smallEl.textContent = formatAnsLine();
  } else {
    smallEl.textContent = "";
  }

  // ✅ Always show right-side (as 0 when empty) in expression mode
  if (!justEvaluated && op !== null && left !== null){
    bigEl.textContent = `${stripFloat(left)} ${opSymbol(op)} ${displayInput()}`;
  } else {
    bigEl.textContent = displayInput();
  }
}

function ac(){
  ans = 0;
  left = null;
  op = null;
  input = "0";
  justEvaluated = false;
  render();
}

function tapNum(d){
  if (justEvaluated && op === null){
    input = "0";
    justEvaluated = false;
  }

  // If right side is "empty", start it
  if (input === "") {
    input = d;
  } else {
    input = (input === "0") ? d : input + d;
  }

  render();
}

function tapDot(){
  if (justEvaluated && op === null){
    input = "0";
    justEvaluated = false;
  }

  if (input === "") input = "0";
  if (!input.includes(".")) input += ".";
  render();
}

function backspace(){
  // ✅ If operator is set and right-side hasn't started, remove the operator
  if (op !== null && left !== null && input === ""){
    op = null;
    input = stripFloat(left);
    left = null;
    justEvaluated = false;
    render();
    return;
  }

  // Normal: delete digits from current input (including turning "5" -> "" if we're on the right side)
  if (input.length > 1){
    input = input.slice(0, -1);
  } else {
    // If we're on the right side, go back to empty (so next backspace removes operator)
    if (op !== null && left !== null){
      input = "";
    } else {
      input = "0";
    }
  }

  justEvaluated = false;
  render();
}

function setOp(newOp){
  if (justEvaluated){
    justEvaluated = false;
  }

  // If user taps a new operator while right side is empty, just change operator
  if (left !== null && op !== null && input === ""){
    op = newOp;
    render();
    return;
  }

  // If no left yet, lock current number into left
  if (left === null){
    left = Number(displayInput());
  } else if (op !== null && input !== ""){
    // Chain operations only if right side has started
    const result = compute(left, op, Number(displayInput()));
    left = result;
    ans = result;
  }

  op = newOp;

  // ✅ Key: make right side empty so backspace can remove the op
  input = "";
  render();
}

function percent(){
  input = stripFloat(Number(displayInput()) / 100);
  justEvaluated = false;
  render();
}

function equals(){
  if (left === null || op === null) return;
  if (input === "") input = "0"; // treat empty right side as 0

  const result = compute(left, op, Number(displayInput()));
  ans = result;
  input = stripFloat(result);
  justEvaluated = true;
  render();

  left = null;
  op = null;
}

function compute(a,o,b){
  switch(o){
    case '+': return a+b;
    case '-': return a-b;
    case '*': return a*b;
    case '/': return b===0 ? NaN : a/b;
  }
}

render();
</script>
</body>
</html>
