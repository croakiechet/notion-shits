<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calculator</title>

<style>
  :root{
    /* your palette */
    --p1:#23395d;
    --p2:#203354;
    --p3:#1c2e4a;
    --p4:#192841;
    --p5:#152238;

    /* extra */
    --text:#d5dbe2;          /* from your screenshot */
    --text-dim:rgba(213,219,226,.75);
    --shadow: rgba(0,0,0,.35);
  }

  /* Notion-embed friendly: no scrolling */
  html, body{
    margin:0;
    padding:0;
    height:100%;
    overflow:hidden;
    background:transparent;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }

  /* center it */
  body{
    display:flex;
    justify-content:center;
    align-items:flex-start;
  }

  /* "scale equally" wrapper: shrink to fit narrow embeds */
  .wrap{
    width: min(360px, 96vw);
    padding: 14px;
    box-sizing:border-box;
  }

  .calc{
    width: 100%;
    border-radius: 28px;
    background: linear-gradient(180deg, var(--p4), var(--p5));
    box-shadow: 0 16px 40px var(--shadow);
    padding: 16px;
    box-sizing:border-box;
    user-select:none;
  }

  .display{
    height: 92px;
    border-radius: 22px;
    background: rgba(0,0,0,.12);
    padding: 10px 14px;
    box-sizing:border-box;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    gap:6px;
    overflow:hidden;
  }

  .display .top{
    color: var(--text-dim);
    font-size: 14px;
    text-align:right;
    min-height: 18px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .display .main{
    color: var(--text);
    font-size: clamp(32px, 7.2vw, 44px);
    line-height: 1.1;
    text-align:right;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .keys{
    margin-top: 14px;
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  button{
    border:0;
    outline:0;
    cursor:pointer;
    height: 64px;
    border-radius: 999px;
    font-size: 20px;
    color: var(--text);
    background: var(--p3);
    box-shadow: 0 10px 18px rgba(0,0,0,.22);
    transition: transform .06s ease, filter .12s ease;
  }
  button:active{ transform: scale(.98); filter: brightness(1.06); }

  /* Top row (AC, ±, %) */
  .func{
    background: var(--p2);
    color: var(--text);
  }

  /* Operators */
  .op{
    background: var(--p1);
    color: var(--text);
    font-weight: 650;
  }

  /* Zero button (iphone-style wide) */
  .zero{
    grid-column: span 2;
    text-align:left;
    padding-left: 26px;
  }

  /* Optional: highlight active operator */
  .op.active{
    filter: brightness(1.12);
  }
</style>
</head>

<body>
  <div class="wrap">
    <div class="calc" role="application" aria-label="Calculator">
      <div class="display">
        <div class="top" id="history"></div>
        <div class="main" id="screen">0</div>
      </div>

      <div class="keys">
        <button class="func" data-action="clear">AC</button>
        <button class="func" data-action="sign">±</button>
        <button class="func" data-action="percent">%</button>
        <button class="op" data-op="÷">÷</button>

        <button data-num="7">7</button>
        <button data-num="8">8</button>
        <button data-num="9">9</button>
        <button class="op" data-op="×">×</button>

        <button data-num="4">4</button>
        <button data-num="5">5</button>
        <button data-num="6">6</button>
        <button class="op" data-op="−">−</button>

        <button data-num="1">1</button>
        <button data-num="2">2</button>
        <button data-num="3">3</button>
        <button class="op" data-op="+">+</button>

        <button class="zero" data-num="0">0</button>
        <button data-action="dot">.</button>
        <button class="op" data-action="equals">=</button>
      </div>
    </div>
  </div>

<script>
  const screen = document.getElementById('screen');
  const historyEl = document.getElementById('history');
  const keys = document.querySelector('.keys');
  const opButtons = [...document.querySelectorAll('.op[data-op]')];

  let current = "0";
  let prev = null;
  let op = null;
  let waitingForNext = false;

  function setScreen(v){
    screen.textContent = v;
  }
  function setHistory(v){
    historyEl.textContent = v || "";
  }
  function clearActiveOps(){
    opButtons.forEach(b => b.classList.remove('active'));
  }

  function inputDigit(d){
    if (waitingForNext){
      current = d;
      waitingForNext = false;
    } else {
      current = (current === "0") ? d : current + d;
    }
    setScreen(current);
  }

  function inputDot(){
    if (waitingForNext){
      current = "0.";
      waitingForNext = false;
      setScreen(current);
      return;
    }
    if (!current.includes(".")){
      current += ".";
      setScreen(current);
    }
  }

  function toNumber(s){
    // keep it safe
    const n = Number(s);
    return Number.isFinite(n) ? n : 0;
  }

  function format(n){
    // similar to phone: avoid huge decimals
    if (!Number.isFinite(n)) return "Error";
    const abs = Math.abs(n);
    if (abs !== 0 && (abs >= 1e12 || abs < 1e-9)) return n.toExponential(6).replace(/0+e/, 'e').replace(/\.e/, 'e');
    // up to 10-12 significant-ish digits
    const s = (Math.round(n * 1e10) / 1e10).toString();
    return s;
  }

  function compute(a, operator, b){
    switch(operator){
      case "+": return a + b;
      case "−": return a - b;
      case "×": return a * b;
      case "÷": return b === 0 ? NaN : a / b;
      default: return b;
    }
  }

  function chooseOperator(nextOp, btn){
    const inputValue = toNumber(current);

    if (op && waitingForNext){
      // just change operator
      op = nextOp;
      setHistory(`${format(prev)} ${op}`);
      clearActiveOps();
      if (btn) btn.classList.add('active');
      return;
    }

    if (prev === null){
      prev = inputValue;
    } else if (op){
      const result = compute(prev, op, inputValue);
      prev = result;
      current = format(result);
      setScreen(current);
    }

    op = nextOp;
    waitingForNext = true;
    setHistory(`${format(prev)} ${op}`);
    clearActiveOps();
    if (btn) btn.classList.add('active');
  }

  function equals(){
    const inputValue = toNumber(current);
    if (op === null || prev === null) return;

    const result = compute(prev, op, inputValue);
    setHistory(`${format(prev)} ${op} ${format(inputValue)} =`);
    current = format(result);
    setScreen(current);
    prev = null;
    op = null;
    waitingForNext = true;
    clearActiveOps();
  }

  function clearAll(){
    current = "0";
    prev = null;
    op = null;
    waitingForNext = false;
    setScreen(current);
    setHistory("");
    clearActiveOps();
  }

  function toggleSign(){
    if (current === "0") return;
    current = current.startsWith("-") ? current.slice(1) : "-" + current;
    setScreen(current);
  }

  function percent(){
    // iphone-ish: percent of current
    const n = toNumber(current) / 100;
    current = format(n);
    setScreen(current);
  }

  keys.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;

    const num = btn.getAttribute('data-num');
    const action = btn.getAttribute('data-action');
    const nextOp = btn.getAttribute('data-op');

    if (num !== null){
      inputDigit(num);
      return;
    }

    if (action){
      if (action === "clear") clearAll();
      if (action === "dot") inputDot();
      if (action === "equals") equals();
      if (action === "sign") toggleSign();
      if (action === "percent") percent();
      return;
    }

    if (nextOp){
      chooseOperator(nextOp, btn);
    }
  });

  // keyboard support (optional but nice)
  window.addEventListener('keydown', (e) => {
    const k = e.key;
    if (k >= "0" && k <= "9") return inputDigit(k);
    if (k === ".") return inputDot();
    if (k === "Enter" || k === "=") return equals();
    if (k === "Escape") return clearAll();
    if (k === "+") return chooseOperator("+");
    if (k === "-") return chooseOperator("−");
    if (k === "*") return chooseOperator("×");
    if (k === "/") return chooseOperator("÷");
    if (k === "%") return percent();
  });
</script>
</body>
</html>
