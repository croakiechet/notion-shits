<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
:root{
  --c1:#011f4b;
  --c2:#03396c;
  --c3:#005b96;
  --c4:#6497b1;
  --c5:#b3cde0;
}

html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:transparent;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:system-ui, -apple-system, sans-serif;
}

/* calculator */
.calc{
  background:var(--c2);
  padding:16px;
  border-radius:28px;
  width:280px;
  transform-origin:center;
  margin:auto;
  flex:0 0 auto;
}

.display{
  background:var(--c5);
  border-radius:20px;
  padding:10px 14px;
  margin-bottom:14px;
  color:var(--c1);
}

.small{
  font-size:14px;
  text-align:right;
  min-height:18px;
  opacity:.7;
}

.big{
  font-size:40px;
  text-align:right;
  line-height:1.1;
  min-height:44px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

button{
  height:58px;
  border:none;
  border-radius:50%;
  font-size:20px;
  cursor:pointer;
}

.num{ background:var(--c4); color:var(--c1); }
.op{ background:var(--c3); color:white; }
.top{ background:var(--c5); color:var(--c1); }

.zero{
  grid-column:span 2;
  border-radius:30px;
}
</style>
</head>

<body>
<div class="calc">

  <div class="display">
    <div id="small" class="small"></div>
    <div id="big" class="big">0</div>
  </div>

  <div class="grid">
    <button class="top" onclick="ac()">AC</button>
    <button class="top" onclick="backspace()">⌫</button>
    <button class="op" onclick="percent()">%</button>
    <button class="op" onclick="setOp('/')">÷</button>

    <button class="num" onclick="tapNum('7')">7</button>
    <button class="num" onclick="tapNum('8')">8</button>
    <button class="num" onclick="tapNum('9')">9</button>
    <button class="op" onclick="setOp('*')">×</button>

    <button class="num" onclick="tapNum('4')">4</button>
    <button class="num" onclick="tapNum('5')">5</button>
    <button class="num" onclick="tapNum('6')">6</button>
    <button class="op" onclick="setOp('-')">−</button>

    <button class="num" onclick="tapNum('1')">1</button>
    <button class="num" onclick="tapNum('2')">2</button>
    <button class="num" onclick="tapNum('3')">3</button>
    <button class="op" onclick="setOp('+')">+</button>

    <button class="num zero" onclick="tapNum('0')">0</button>
    <button class="num" onclick="tapDot()">.</button>
    <button class="op" onclick="equals()">=</button>
  </div>
</div>

<script>
const smallEl = document.getElementById("small");
const bigEl   = document.getElementById("big");

let ans = 0;
let left = null;
let op = null;
let input = "0";
let justEvaluated = false;

/* SCALE FIX (no scrolling + equal scaling) */
function setScale(){
  const calc = document.querySelector(".calc");

  const baseWidth = 280;
  const baseHeight = 520;
  const padding = 24;

  const defaultScale = 0.82; // adjust if you want smaller/bigger

  const scaleW = (window.innerWidth - padding) / baseWidth;
  const scaleH = (window.innerHeight - padding) / baseHeight;

  const scale = Math.min(defaultScale, scaleW, scaleH);

  calc.style.transform = `scale(${scale})`;
}

window.addEventListener("resize", setScale);
setScale();

/* calculator logic */

function opSymbol(o){
  return o === '*' ? '×' : (o === '/' ? '÷' : o);
}

function stripFloat(n){
  if (Number.isInteger(n)) return String(n);
  return String(parseFloat(n.toFixed(10)));
}

function render(){
  if (justEvaluated && left !== null && op !== null){
    smallEl.textContent = `${stripFloat(left)} ${opSymbol(op)} ${input} =`;
  } else if (op !== null || left !== null || input !== "0"){
    smallEl.textContent = `Ans = ${stripFloat(ans)}`;
  } else {
    smallEl.textContent = "";
  }

  if (!justEvaluated && op !== null && left !== null){
    const rightPart = input === "0" ? "" : ` ${input}`;
    bigEl.textContent = `${stripFloat(left)} ${opSymbol(op)}${rightPart}`;
  } else {
    bigEl.textContent = input;
  }
}

function ac(){
  ans = 0;
  left = null;
  op = null;
  input = "0";
  justEvaluated = false;
  render();
}

function tapNum(d){
  if (justEvaluated && op === null){
    input = "0";
    justEvaluated = false;
  }
  input = input === "0" ? d : input + d;
  render();
}

function tapDot(){
  if (!input.includes(".")) input += ".";
  render();
}

function backspace(){
  input = input.length > 1 ? input.slice(0,-1) : "0";
  render();
}

function setOp(newOp){
  if (justEvaluated){
    left = Number(input);
    op = newOp;
    input = "0";
    justEvaluated = false;
    render();
    return;
  }

  if (left === null){
    left = Number(input);
    op = newOp;
    input = "0";
    render();
    return;
  }

  if (op !== null){
    const right = Number(input);
    const result = compute(left, op, right);
    left = result;
    ans = result;
    input = "0";
  }

  op = newOp;
  render();
}

function percent(){
  input = stripFloat(Number(input) / 100);
  render();
}

function equals(){
  if (left === null || op === null) return;

  const right = Number(input);
  const result = compute(left, op, right);

  ans = result;
  input = stripFloat(result);
  justEvaluated = true;

  render();

  left = null;
  op = null;
}

function compute(a,o,b){
  switch(o){
    case '+': return a+b;
    case '-': return a-b;
    case '*': return a*b;
    case '/': return b===0 ? NaN : a/b;
  }
}
render();
</script>
</body>
</html>
