<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
:root{
  --c1:#011f4b;
  --c2:#03396c;
  --c3:#005b96;
  --c4:#6497b1;
  --c5:#b3cde0;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  background:transparent;
  font-family:system-ui, -apple-system, sans-serif;
}

/* centers + prevents crop */
.wrap{
  width:100%;
  display:flex;
  justify-content:flex-start; /* left aligned like your page */
  padding:0;
  overflow:visible;
}

/* SCALE DOWN EQUALLY */
.calc{
  --scale: 0.78;              /* <-- change this number (0.7 smaller, 0.85 bigger) */
  width:280px;
  background:var(--c2);
  padding:16px;
  border-radius:28px;

  transform: scale(var(--scale));
  transform-origin: top left;
}

/* This makes the iframe/container reserve the scaled height so it won't cut off */
.spacer{
  width: calc(280px * var(--scale));
  height: calc(460px * var(--scale)); /* approx calc height; tweak if needed */
}

/* your original styles (unchanged) */
.display{
  background:var(--c5);
  border-radius:20px;
  padding:10px 14px;
  margin-bottom:14px;
  color:var(--c1);
}

.small{
  font-size:14px;
  text-align:right;
  min-height:18px;
  opacity:.7;
}

.big{
  font-size:40px;
  text-align:right;
  line-height:1.1;
  min-height:44px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

button{
  height:58px;
  border:none;
  border-radius:50%;
  font-size:20px;
  cursor:pointer;
}

.num{ background:var(--c4); color:var(--c1); }
.op{ background:var(--c3); color:white; }
.top{ background:var(--c5); color:var(--c1); }

.zero{
  grid-column:span 2;
  border-radius:30px;
}
</style>
</head>

<body>
  <div class="wrap">
    <div class="spacer">
      <div class="calc">
        <div class="display">
          <div id="small" class="small"></div>
          <div id="big" class="big">0</div>
        </div>

        <div class="grid">
          <button class="top" onclick="ac()">AC</button>
          <button class="top" onclick="backspace()">⌫</button>
          <button class="op" onclick="percent()">%</button>
          <button class="op" onclick="setOp('/')">÷</button>

          <button class="num" onclick="tapNum('7')">7</button>
          <button class="num" onclick="tapNum('8')">8</button>
          <button class="num" onclick="tapNum('9')">9</button>
          <button class="op" onclick="setOp('*')">×</button>

          <button class="num" onclick="tapNum('4')">4</button>
          <button class="num" onclick="tapNum('5')">5</button>
          <button class="num" onclick="tapNum('6')">6</button>
          <button class="op" onclick="setOp('-')">−</button>

          <button class="num" onclick="tapNum('1')">1</button>
          <button class="num" onclick="tapNum('2')">2</button>
          <button class="num" onclick="tapNum('3')">3</button>
          <button class="op" onclick="setOp('+')">+</button>

          <button class="num zero" onclick="tapNum('0')">0</button>
          <button class="num" onclick="tapDot()">.</button>
          <button class="op" onclick="equals()">=</button>
        </div>
      </div>
    </div>
  </div>

<script>
/* keep your existing JS exactly as-is */
</script>
</body>
</html>
