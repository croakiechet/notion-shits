<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mini Calendar</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu&family=Sour+Gummy:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

<style>

/* NOTION FRIENDLY */
html, body{
  margin:0;
  padding:0;
  height:100%;
  overflow:hidden;
  background:transparent;
}

body{
  display:flex;
  justify-content:center;
  align-items:flex-start;
  -webkit-tap-highlight-color: transparent;
  font-family: system-ui, -apple-system, sans-serif;
}

/* COLOR SCHEME */
:root{
  --navy1:#23395d;
  --navy2:#203354;
  --navy3:#1c2e4a;
  --navy4:#192841;
  --navy5:#152238;

  --ice:#E8EDF6;
  --ice2:#D8E0EE;

  --weekday-color: var(--ice);
  --innerBorder-color: rgba(232,237,246,0.16);
  --containerBorder-color: rgba(232,237,246,0.18);
  --sunday-color: var(--ice);
  --saturday-color: var(--ice);
  --current-day: var(--ice2);
  --container: var(--navy2);
  --inner-container: var(--navy4);

  --fontWgt: 650;
  --headerFont: "Gaegu", serif;
  --textFont: "Sour Gummy", serif;
}

/* CARD */
.calendar-container{
  display:flex;
  justify-content:center;
  align-items:center;

  width:194px;
  min-height:204px;

  background:var(--container);
  border-radius:40px;
  border:3px solid var(--containerBorder-color);
  padding:14px;
}

.inner-container{
  width:180px;
  min-height:190px;

  background:var(--inner-container);
  border:3px solid var(--innerBorder-color);
  border-radius:32px;
  padding:10px;
}

/* HEADER */
.header{
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-bottom:-7px;
}

#year{
  font-family:var(--headerFont);
  color:var(--weekday-color);
  font-size:0.8em;
  margin-bottom:-12px;
  font-weight:var(--fontWgt);
}

#month{
  font-family:var(--headerFont);
  color:var(--weekday-color);
  font-size:1.4em;
  letter-spacing:1.5px;
  font-weight:var(--fontWgt);
}

.controls{
  display:flex;
  justify-content:space-between;
  align-items:center;
  width:190px;
  margin:10px auto;
}

.controls button{
  color:var(--weekday-color);
  background:transparent;
  border:0;
  font-family:var(--headerFont);
  font-weight:var(--fontWgt);
  opacity:0.7;
  cursor:pointer;
}

.controls button:hover{
  opacity:1;
}

/* TABLE */
table{
  border-collapse:collapse;
  width:140px;
  margin:1px auto;
  user-select:none;
}

th, td{
  padding:0 4px;
  line-height:1.2;
  text-align:center;
}

/* DAYS OF WEEK */
th{
  font-family:var(--headerFont);
  color:var(--weekday-color);
  font-size:15px;
  font-weight:var(--fontWgt);
}

.days{
  font-family:var(--textFont);
  font-size:15px;
  color:var(--weekday-color);
  font-weight:var(--fontWgt);
}

/* CURRENT DAY BLOB (NO SHADOW) */
.current-day{
  position:relative;
  z-index:1;
  color:#0e1726;
}

.current-day::before{
  content:"";
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%) skew(5deg,3deg);
  width:19px;
  height:19px;
  background:var(--current-day);
  border-radius:50%;
  z-index:-1;
}

/* EMPTY CELLS KEEP SIZE */
.empty{
  opacity:0;
}

</style>
</head>

<body>

<div class="calendar-container">
  <div class="inner-container">

    <div class="header">
      <span id="year"></span>
      <div class="controls">
        <button id="prevMonth">&lt;</button>
        <span id="month"></span>
        <button id="nextMonth">&gt;</button>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>S</th><th>M</th><th>T</th>
          <th>W</th><th>T</th><th>F</th><th>S</th>
        </tr>
      </thead>
      <tbody class="days" id="daysBody"></tbody>
    </table>

  </div>
</div>

<script>
(function(){

  const yearEl = document.getElementById("year");
  const monthEl = document.getElementById("month");
  const daysBody = document.getElementById("daysBody");
  const prevBtn = document.getElementById("prevMonth");
  const nextBtn = document.getElementById("nextMonth");

  const monthNames = [
    "January","February","March","April","May","June",
    "July","August","September","October","November","December"
  ];

  const today = new Date();
  let viewYear = today.getFullYear();
  let viewMonth = today.getMonth();

  function sameDay(a,b){
    return a.getFullYear()==b.getFullYear()
    && a.getMonth()==b.getMonth()
    && a.getDate()==b.getDate();
  }

  function render(y,m){

    yearEl.textContent = y;
    monthEl.textContent = monthNames[m];
    daysBody.innerHTML="";

    const first = new Date(y,m,1);
    const last  = new Date(y,m+1,0);

    const start = first.getDay();
    const days = last.getDate();

    let d=1;

    for(let r=0;r<6;r++){
      const tr=document.createElement("tr");

      for(let c=0;c<7;c++){
        const td=document.createElement("td");
        const index=r*7+c;

        if(index<start || d>days){
          td.classList.add("empty");
          td.textContent="0";
        }else{
          const date=new Date(y,m,d);
          td.textContent=d;

          if(sameDay(date,today)){
            td.classList.add("current-day");
          }
          d++;
        }

        tr.appendChild(td);
      }

      daysBody.appendChild(tr);
    }
  }

  prevBtn.onclick=()=>{
    viewMonth--;
    if(viewMonth<0){viewMonth=11;viewYear--;}
    render(viewYear,viewMonth);
  };

  nextBtn.onclick=()=>{
    viewMonth++;
    if(viewMonth>11){viewMonth=0;viewYear++;}
    render(viewYear,viewMonth);
  };

  render(viewYear,viewMonth);

})();
</script>

</body>
</html>
