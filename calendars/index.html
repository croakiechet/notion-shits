<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini Calendar — Navy + Icy Grey</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu&family=Sour+Gummy:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <style>
    /* Notion/embed friendly */
    html, body{
      margin:0;
      padding:0;
      height:100%;
      overflow:hidden;
      background:transparent;
    }

    body{
      display:flex;
      justify-content:center;
      align-items:flex-start;
      -webkit-tap-highlight-color: transparent;
      font-family: system-ui, -apple-system, sans-serif;
    }

    :root{
      /* YOUR NAVY SCHEME */
      --navy1:#23395d;
      --navy2:#203354;
      --navy3:#1c2e4a;
      --navy4:#192841;
      --navy5:#152238;

      /* White-ish icy greys that complement */
      --ice:#E8EDF6;
      --ice2:#D8E0EE;

      /* Mapped to your original variable names */
      --weekday-color: var(--ice);
      --innerBorder-color: rgba(232,237,246,0.16);
      --containerBorder-color: rgba(232,237,246,0.18);
      --sunday-color: var(--ice);
      --saturday-color: var(--ice);
      --current-day: var(--ice2);
      --container: var(--navy2);
      --inner-container: var(--navy4);

      --fontWgt: 650;
      --headerFont: "Gaegu", serif;
      --textFont: "Sour Gummy", serif;
    }

    /* containers */
    .calendar-container{
      position: relative;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;

      width: 194px;
      min-height: 204px;

      background-color: var(--container);
      border-radius: 40px;
      border: solid 3px var(--containerBorder-color);

      text-align:center;
      padding: 14px;
      margin: 20px auto;

      box-shadow:
        0 10px 30px rgba(0,0,0,0.28),
        inset 0 1px 0 rgba(255,255,255,0.06);
    }

    .inner-container{
      position: absolute;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;

      width: 180px;
      min-height: 190px;

      background-color: var(--inner-container);
      border: solid 3px var(--innerBorder-color);
      border-radius: 32px;

      text-align:center;
      padding: 10px;

      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
    }

    /* header */
    .header{
      margin-bottom: -7px;
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
    }

    #year{
      user-select:none;
      font-family: var(--headerFont);
      color: rgba(232,237,246,0.88);
      font-size: 0.8em;
      margin-bottom: -12px;
      font-weight: var(--fontWgt);
      letter-spacing: 0.4px;
    }

    #month{
      user-select:none;
      font-family: var(--headerFont);
      color: var(--weekday-color);
      padding:0;
      margin:0;
      font-size: 1.4em;
      letter-spacing: 1.5px;
      font-weight: var(--fontWgt);
    }

    .controls{
      display:flex;
      justify-content:space-between;
      align-items:center;
      width: 190px;
      margin: 10px auto;
      gap: 8px;
    }

    .controls button{
      color: var(--weekday-color);
      flex: 0 0 35px;
      text-align:center;

      font-family: var(--headerFont);
      font-size: 1em;
      font-weight: var(--fontWgt);

      opacity: 0.75;
      border:0;
      background-color: transparent;
      cursor:pointer;

      width: 34px;
      height: 34px;
      border-radius: 12px;

      box-shadow: inset 0 0 0 1px rgba(232,237,246,0.12);
      transition: transform 120ms ease, opacity 120ms ease, box-shadow 120ms ease;
    }

    .controls button:hover{
      opacity: 1;
      box-shadow:
        inset 0 0 0 1px rgba(232,237,246,0.22),
        0 6px 16px rgba(0,0,0,0.25);
    }

    .controls button:active{
      transform: translateY(1px) scale(0.98);
    }

    /* table */
    table{
      user-select:none;
      border-collapse: collapse;
      width: 140px;
      margin: 1px auto;
    }

    th, td{
      padding: 0 4px;
      line-height: 1.2;
      border:0;
      text-align:center;
    }

    /* days of week */
    th{
      font-family: var(--headerFont);
      color: rgba(232,237,246,0.88);
      font-size: 15px;
      font-weight: var(--fontWgt);
      padding: 2px 0;
    }

    th:first-child{ color: var(--sunday-color); }
    th:last-child{  color: var(--saturday-color); }

    /* day numbers */
    .days{
      font-family: var(--textFont);
      font-size: 15px;
      color: rgba(232,237,246,0.92);
      border:0;
      font-weight: var(--fontWgt);
    }

    td:first-child{ color: var(--sunday-color); }
    td:last-child{  color: var(--saturday-color); }

    /* subtle hover */
    td{
      border-radius: 10px;
      transition: background-color 120ms ease, transform 120ms ease;
    }
    td:hover{
      background: rgba(232,237,246,0.08);
      transform: translateY(-0.5px);
    }

    /* current day blob */
    .current-day{
      position: relative;
      z-index: 1;
      color: #0e1726; /* dark ink on light blob */
    }

    .current-day::before{
      content:"";
      position:absolute;
      top:50%;
      left:50%;
      transform: translate(-50%, -50%) skew(5deg, 3deg);
      width: 19px;
      height: 19px;
      background-color: var(--current-day);
      border-radius: 50%;
      z-index: -1;
      box-shadow:
        0 6px 14px rgba(0,0,0,0.18),
        inset 0 1px 0 rgba(255,255,255,0.35);
    }

    /* keep empty cells sized but invisible */
    .empty{
      opacity: 0;
      pointer-events:none;
    }
  </style>
</head>

<body>
  <div id="calendar-card" class="calendar-container">
    <div class="inner-container">
      <!-- Front Side -->
      <div id="calendar-front">
        <div class="header">
          <span id="year"></span>
          <div class="controls">
            <button id="prevMonth" aria-label="Previous month">&lt;</button>
            <span id="month"></span>
            <button id="nextMonth" aria-label="Next month">&gt;</button>
          </div>
        </div>

        <table id="calendar">
          <thead>
            <tr>
              <th>S</th><th>M</th><th>T</th><th>W</th><th>T</th><th>F</th><th>S</th>
            </tr>
          </thead>
          <tbody class="days" id="daysBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    (function(){
      const yearEl = document.getElementById("year");
      const monthEl = document.getElementById("month");
      const daysBody = document.getElementById("daysBody");
      const prevBtn = document.getElementById("prevMonth");
      const nextBtn = document.getElementById("nextMonth");

      const monthNames = [
        "January","February","March","April","May","June",
        "July","August","September","October","November","December"
      ];

      const today = new Date();
      let viewYear = today.getFullYear();
      let viewMonth = today.getMonth(); // 0-11

      function isSameDay(a, b){
        return a.getFullYear() === b.getFullYear() &&
               a.getMonth() === b.getMonth() &&
               a.getDate() === b.getDate();
      }

      function renderCalendar(y, m){
        yearEl.textContent = y;
        monthEl.textContent = monthNames[m];
        daysBody.innerHTML = "";

        const firstDay = new Date(y, m, 1);
        const lastDay  = new Date(y, m + 1, 0);

        const startDow = firstDay.getDay();     // 0=Sun
        const daysInMonth = lastDay.getDate();  // 28-31

        let dayNum = 1;

        // 6 rows keeps the card stable
        for(let row=0; row<6; row++){
          const tr = document.createElement("tr");

          for(let col=0; col<7; col++){
            const td = document.createElement("td");
            const cellIndex = row*7 + col;

            if(cellIndex < startDow || dayNum > daysInMonth){
              td.classList.add("empty");
              td.textContent = "0"; // invisible but keeps sizing
            } else {
              const cellDate = new Date(y, m, dayNum);
              td.textContent = String(dayNum);

              if(isSameDay(cellDate, today)){
                td.classList.add("current-day");
              }
              dayNum++;
            }

            tr.appendChild(td);
          }

          daysBody.appendChild(tr);
        }
      }

      prevBtn.addEventListener("click", () => {
        viewMonth--;
        if(viewMonth < 0){ viewMonth = 11; viewYear--; }
        renderCalendar(viewYear, viewMonth);
      });

      nextBtn.addEventListener("click", () => {
        viewMonth++;
        if(viewMonth > 11){ viewMonth = 0; viewYear++; }
        renderCalendar(viewYear, viewMonth);
      });

      renderCalendar(viewYear, viewMonth);
    })();
  </script>
</body>
</html>
